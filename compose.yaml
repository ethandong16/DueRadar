services:
  dueradar:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DUERADAR_ADMIN_PASSWORD: ${DUERADAR_ADMIN_PASSWORD:-}
      # 从 .env 读取注册策略；请显式设置 true 或 false。
      DUERADAR_ALLOW_REGISTRATION: ${DUERADAR_ALLOW_REGISTRATION:-}
      DUERADAR_SECURE_COOKIES: ${DUERADAR_SECURE_COOKIES:-false}
      # 可选：知到自动续期从只读短信模块读取验证码。
      DUERADAR_SMS_API_URL: ${DUERADAR_SMS_API_URL:-}
      DUERADAR_SMS_API_TOKEN: ${DUERADAR_SMS_API_TOKEN:-}
    volumes:
      - dueradar-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "3"
volumes:
  dueradar-data:
